<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <section class="container">
      <section class="card">
        <img src="assets/images/illustration-article.svg" class="card-image">
  
        <div class="card-description">
          <p class="card-type">Learning</p>
          <p class="card-date">Published 21 Dec 2023</p>
          <h1 class="card-title">HTML & CSS foundations</h1>
          <p class="card-text">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
  
        <div class="card-author">
          <img src="assets/images/image-avatar.webp" alt="Normal white man looking to the left" class="card-author-img">
          <p class="card-author-name">Greg Hooper</p>
        </div>
      </section>
    </section>
</main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">ThiagoBDN</a>.
  </footer>
</body>
</html>
